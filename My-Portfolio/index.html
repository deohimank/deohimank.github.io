<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Himank Deo | Portfolio</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --text-color: #ffffff;
            --accent-color: #38bdf8; 
            --glass-bg: rgba(15, 23, 42, 0.65); 
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        /* --- BACKGROUND --- */
        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?q=80&w=1920&auto=format&fit=crop') no-repeat center center/cover;
            animation: kenburns 20s infinite alternate;
        }
        .bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.25); z-index: -1;
        }
        @keyframes kenburns { 0% { transform: scale(1); } 100% { transform: scale(1.15); } }

        .container { width: 100%; max-width: 420px; text-align: center; }

        /* --- PROFILE --- */
        .profile-img {
            width: 130px; height: 130px; border-radius: 50%; object-fit: cover;
            border: 3px solid #ffffff; padding: 4px; margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: transform 0.3s ease;
        }
        .profile-img:hover { transform: scale(1.05); }

        h1 { font-family: 'Cinzel', serif; font-size: 2.2rem; margin-bottom: 5px; color: #ffffff; letter-spacing: 1px; text-shadow: 0 4px 20px rgba(0,0,0,0.8); }
        p.title { color: #f1f5f9; font-size: 1rem; margin-bottom: 30px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }

        /* --- STATS --- */
        .stats-row {
            display: flex; justify-content: space-between; background: var(--glass-bg);
            border: 1px solid var(--glass-border); border-radius: 12px; padding: 15px;
            margin-bottom: 25px; backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .stat-item { flex: 1; text-align: center; }
        .stat-item:not(:last-child) { border-right: 1px solid var(--glass-border); }
        .stat-number { display: block; font-size: 1.2rem; font-weight: 700; color: #ffffff; }
        .stat-label { font-size: 0.7rem; color: #cbd5e1; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

        /* --- LINKS --- */
        .links { display: flex; flex-direction: column; gap: 15px; }
        .link-card {
            background: var(--glass-bg); backdrop-filter: blur(10px); padding: 18px 20px;
            border-radius: 50px; text-decoration: none; color: #ffffff; display: flex;
            align-items: center; border: 1px solid var(--glass-border); transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); cursor: pointer;
        }
        .link-card:hover { transform: translateY(-3px); background: #ffffff; color: #0f172a; border-color: #ffffff; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .link-card i { font-size: 1.3rem; width: 35px; color: var(--accent-color); transition: color 0.3s; }
        .link-card:hover i { color: #0f172a; }
        .link-card span { font-weight: 500; flex-grow: 1; text-align: left; letter-spacing: 0.5px; }
        .arrow { font-size: 0.8rem; opacity: 0.7; }

        .ad-container { margin-top: 40px; padding: 15px; background: rgba(0,0,0,0.5); border: 1px dashed rgba(255,255,255,0.4); border-radius: 12px; min-height: 100px; display: flex; justify-content: center; align-items: center; font-size: 0.8rem; color: #cbd5e1; }
        footer { margin-top: 30px; font-size: 0.75rem; color: #ffffff; letter-spacing: 1px; text-shadow: 0 2px 5px rgba(0,0,0,1); }

        /* --- MODAL (DIALOG BOX) STYLES --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 100;
            display: none; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .modal-box {
            background: #1e293b; width: 90%; max-width: 400px;
            border-radius: 16px; padding: 25px; border: 1px solid rgba(255,255,255,0.1);
            transform: scale(0.9); transition: transform 0.3s ease;
            max-height: 80vh; overflow-y: auto; /* Scroll if too many certs */
        }
        /* Open State */
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-overlay.active .modal-box { transform: scale(1); }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;}
        .modal-title { font-family: 'Cinzel', serif; font-size: 1.2rem; color: #38bdf8; }
        .close-btn { background: none; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer; }
        .close-btn:hover { color: #ffffff; }

        .cert-list { display: flex; flex-direction: column; gap: 10px; }
        .cert-item {
            display: flex; align-items: center; padding: 12px;
            background: rgba(255,255,255,0.05); border-radius: 8px;
            text-decoration: none; color: #e2e8f0; transition: background 0.2s;
        }
        .cert-item:hover { background: rgba(255,255,255,0.1); }
        .cert-icon { margin-right: 12px; color: #fbbf24; font-size: 1.1rem; }
        .cert-name { font-size: 0.9rem; flex-grow: 1; text-align: left;}

    </style>
</head>
<body>

    <div class="bg-animation"></div>
    <div class="bg-overlay"></div>

    <div class="container">
        <img src="profile.jpg" alt="Himank Deo" class="profile-img">
        <h1>Himank Deo</h1>
        <p class="title">Data Analyst | Cloud Enthusiast</p>

        <div class="stats-row">
            <div class="stat-item">
                <span class="stat-number">0</span> <span class="stat-label">Projects</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="cert-count">0</span> 
                <span class="stat-label">Certificates</span>
            </div>
            <div class="stat-item">
                <span class="stat-number">0</span> <span class="stat-label">Years Exp.</span>
            </div>
        </div>

        <div class="links">
            <a href="https://www.linkedin.com/in/himank-deo-6a5577311" target="_blank" class="link-card">
                <i class="fa-brands fa-linkedin"></i> <span>LinkedIn Profile</span> <i class="fa-solid fa-chevron-right arrow"></i>
            </a>
            <a href="https://github.com/deohimank" target="_blank" class="link-card">
                <i class="fa-brands fa-github"></i> <span>GitHub Projects</span> <i class="fa-solid fa-chevron-right arrow"></i>
            </a>
            <a href="https://x.com/DeoHimank" target="_blank" class="link-card">
                <i class="fa-brands fa-x-twitter"></i> <span>X (Twitter)</span> <i class="fa-solid fa-chevron-right arrow"></i>
            </a>

            <div class="link-card" onclick="openCertModal()">
                <i class="fa-solid fa-certificate"></i>
                <span>View My Certificates</span>
                <i class="fa-solid fa-chevron-right arrow"></i>
            </div>
        </div>

        <div class="ad-container"> <p>Advertisement Space</p> </div>
        <footer> &copy; 2025 Himank Deo | Work In Progress </footer>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-title">My Certificates</span>
                <button class="close-btn" onclick="closeCertModal()">&times;</button>
            </div>
            <div class="cert-list" id="certListContainer">
                </div>
        </div>
    </div>

    <script>
        // --- 1. YOUR CERTIFICATE DATA ---
        // ADD YOUR CERTIFICATES HERE. The website will count them automatically.
        const myCertificates = [
            { name: "Python for Data Science", link: "Python.pdf" },
            { name: "SQL Advanced Database",   link: "SQL_Certificate.pdf" },
            { name: "Cybersecurity",    link: "Coursera CyberSecurity Certificate.pdf" },
            { name: "Tally Essential Level-2",  link: "Tally.pdf" }
            // To add more, just copy a line above, add a comma, and fill in details.
        ];

        // --- 2. AUTOMATIC SETUP ---
        const certListContainer = document.getElementById('certListContainer');
        const certCountDisplay = document.getElementById('cert-count');

        // A. Update the Count Number automatically
        certCountDisplay.innerText = myCertificates.length;

        // B. Create the List inside the Dialog Box
        myCertificates.forEach(cert => {
            const link = document.createElement('a');
            link.className = 'cert-item';
            link.href = cert.link;
            link.target = '_blank'; // Opens PDF in new tab
            link.innerHTML = `
                <i class="fa-solid fa-file-pdf cert-icon"></i>
                <span class="cert-name">${cert.name}</span>
                <i class="fa-solid fa-download arrow"></i>
            `;
            certListContainer.appendChild(link);
        });

        // --- 3. MODAL FUNCTIONS ---
        function openCertModal() {
            document.getElementById('modalOverlay').classList.add('active');
        }
        function closeCertModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        // Close if clicking outside the box
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) {
                closeCertModal();
            }
        });
    </script>

</body>
</html>
